name: 构建 6.1.118 欧加真OKI内核kernelsu test

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  KERNEL_NAME: 'android14-11-o-gca13bffobf09'

on:
  workflow_dispatch:
    inputs:
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁及 LZ4KD 补丁(0=均不安装,1=安装lz4&zstd补丁,2=安装lz4kd补丁,3=均安装,默认1)'
        required: true
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      ssg_rekernel_enable:
        description: '是否启用三星SSG IO调度器及Re-Kernel支持(0=均不安装,1=安装SSG IO调度器,2=安装Re-Kernel,3=均安装,默认1)'
        required: true
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      lto_type: # <--- 修改: 新增 LTO 选择项: none/thin/full
        description: '启用何种 Link-Time Optimization (LTO) 全局编译优化'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none' # 不启用 LTO
          - 'thin' # 启用 Thin LTO
          - 'full' # 启用 Full LTO
      optimize_o2: # <-- 仅控制 O2 优化
        description: '是否启用 O2 优化。关闭则不添加任何显式优化配置。'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang20工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8650/archive/refs/heads/oneplus/sm8650_v_15.0.0_oneplus12_6.1.118.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_kernel_common_oneplus_sm8650-oneplus-sm8650_v_15.0.0_oneplus12_6.1.118" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-Clang20工具链..." &&
          mkdir -p clang20 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip -o clang.zip &&
          unzip -q clang.zip -d clang20 &&
          rm -rf clang.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-Clang20工具链初始化完成！"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        if: ${{ env.SKIP_CCACHE_SETUP != 'true' }} # <--- 修改: LTO 启用时跳过
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_6.1.118" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：6.1.118"

      - name: 初始化并配置ccache (并清除缓存)
        if: ${{ env.SKIP_CCACHE_SETUP != 'true' }} # <--- 修改: LTO 启用时跳过
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_HARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显式清除所有缓存内容 (用户要求)
          echo "正在清除所有ccache缓存..."
          ccache -C
          
          # 显示初始缓存状态 (此时应为清空状态)
          echo "ccache初始状态:"
          ccache -s

      - name: 仅保留：添加KernelSU (tiann/KernelSU)
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          echo "正在配置原版 KernelSU (tiann/KernelSU)..."
          # 从主分支拉取 KSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
          cd ./KernelSU
          # 获取 KSU 版本号，修复了换行符（\r）导致的 expr 错误
          KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p' | tr -d '\r') "+" 20000)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: ${{ github.event.inputs.lz4_enable == '1' || github.event.inputs.lz4_enable == '3' }}
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          git clone https://github.com/cctv18/oppo_oplus_realme_sm8650.git
          cp ./oppo_oplus_realme_sm8650/zram_patch/001-lz4.patch ./common/
          cp ./oppo_oplus_realme_sm8650/zram_patch/lz4armv8.S ./common/lib
          cp ./oppo_oplus_realme_sm8650/zram_patch/002-zstd.patch ./common/
          cd ./common
          git apply -p1 < 001-lz4.patch || true
          patch -p1 < 002-zstd.patch || true
          
      - name: 应用 lz4kd 补丁
        if: ${{ github.event.inputs.lz4_enable == '2' || github.event.inputs.lz4_enable == '3' }}
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          # 克隆 SukiSU_patch 仅为了获取 lz4kd 补丁
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true

      - name: 启用内核级基带保护
        if: github.event.inputs.baseband_guard == 'true'
        run: |
          echo "正在启用启用内核级基带保护支持…"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common/security
          wget https://github.com/cctv18/Baseband-guard/archive/refs/heads/master.zip
          unzip -q master.zip
          mv "Baseband-guard-master" baseband-guard
          printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> ./Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./Kconfig
          awk '
          /endmenu/ { last_endmenu_line = NR }
          { lines[NR] = $0 }
          END {
            for (i=1; i<=NR; i++) {
              if (i == last_endmenu_line) {
                sub(/endmenu/, "", lines[i]);
                print lines[i] "source \"security/baseband-guard/Kconfig\""
                print ""
                print "endmenu"
              } else {
                  print lines[i]
              }
            }
          }
          ' ./Kconfig > Kconfig.tmp && mv Kconfig.tmp ./Kconfig
          sed -i 's/selinuxfs.o //g' "./selinux/Makefile"
          sed -i 's/hooks.o //g' "./selinux/Makefile"
          cat "./baseband-guard/sepatch.txt" >> "./selinux/Makefile"

      - name: 启用网络功能增强优化配置
        if: github.event.inputs.better_net == 'true'
        run: |
          cd kernel_workspace
          echo "正在启用网络功能增强优化配置..."
          #启用 BPF 流解析器
          echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig
          #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IP 集框架及其多种数据结构实现
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IPv6 网络地址转换
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 修复兼容性检测的补丁
          cd common
          wget https://github.com/cctv18/oppo_oplus_realme_sm8650/raw/refs/heads/main/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        if: github.event.inputs.bbr_enable == 'true' || github.event.inputs.bbr_enable == 'default'
        run: |
          echo "正在添加BBR等拥塞控制算法..."
          cd kernel_workspace
          #开启TCP拥塞控制算法控制器（必需）
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
            echo "正在将BBR设为默认拥塞控制算法..."
            echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: 启用三星SSG IO调度器
        if: ${{ github.event.inputs.ssg_rekernel_enable == '1' || github.event.inputs.ssg_rekernel_enable == '3' }}
        run: |
          echo "正在启用三星SSG IO调度器…"
          cd kernel_workspace
          echo "CONFIG_MQ_IOSCHED_SSG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_SSG_CGROUP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: ${{ github.event.inputs.ssg_rekernel_enable == '2' || github.event.inputs.ssg_rekernel_enable == '3' }}
        run: |
          echo "正在启用Re-Kernel支持…"
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 配置 LTO 编译优化 # <--- 修改步骤名称
        if: github.event.inputs.lto_type != 'none' # <--- 修改条件
        run: |
          echo "正在配置 ${{ github.event.inputs.lto_type }} LTO (Link-Time Optimization)..."
          cd kernel_workspace
          echo "CONFIG_LTO=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LTO_CLANG=y" >> ./common/arch/arm64/configs/gki_defconfig
          
          if [[ "${{ github.event.inputs.lto_type }}" == "thin" ]]; then
            echo "CONFIG_THIN_ARCHIVES=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "LTO 启用 (Thin LTO)，将强制禁用 ccache。"
          elif [[ "${{ github.event.inputs.lto_type }}" == "full" ]]; then
            # Full LTO 不启用 CONFIG_THIN_ARCHIVES
            # 确保不写入 CONFIG_THIN_ARCHIVES=y，即使它可能在 gki_defconfig 中，也会被 make oldconfig 处理掉。
            echo "LTO 启用 (Full LTO)，将强制禁用 ccache。"
          fi
          
          # 严格禁用 ccache 的标志
          echo "USE_CCACHE=false" >> $GITHUB_ENV
          echo "SKIP_CCACHE_SETUP=true" >> $GITHUB_ENV # <--- 新增：跳过 ccache 设置步骤
        
      - name: 应用内核核心配置、KernelSU及定制配置 (含O2优化)
        run: |
          cd kernel_workspace
          # KSU 核心配置
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          
          # 用户自定义配置
          echo "CONFIG_OVERLAY_FS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          
          # LZ4/ZSTD/LZ4KD 配置
          if [[ "${{ github.event.inputs.lz4_enable }}" == "2" || "${{ github.event.inputs.lz4_enable }}" == "3" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          # 编译器 O2 优化配置 (根据 optimize_o2 选项)
          # 清除所有显式优化配置
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' ./common/arch/arm64/configs/gki_defconfig || true
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' ./common/arch/arm64/configs/gki_defconfig || true

          if [[ "${{ github.event.inputs.optimize_o2 }}" == "true" ]]; then
             # CONFIG_CC_OPTIMIZE_FOR_SIZE 在 GKI 中通常用于实现 O2/Os 的平衡优化，这里作为 O2 优化使用
             echo "启用 O2 优化配置 (CONFIG_CC_OPTIMIZE_FOR_SIZE=y)"
             echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
             echo "未启用显式 O2 优化配置，使用内核源码默认设置。"
          fi

          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 应用内核版本后缀
        run: |
          cd kernel_workspace
          KERNEL_SFX="${{ env.KERNEL_NAME }}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            KERNEL_SFX="${{ github.event.inputs.kernel_suffix }}"
            echo "使用自定义内核版本后缀：-${KERNEL_SFX}"
          else
            echo "使用默认内核版本后缀：-${KERNEL_SFX}"
          fi
          
          # Modify setlocalversion to output the determined suffix
          for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${KERNEL_SFX}\"|" "$f"
          done
           
      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          
          # 检查 LTO 启用状态以决定是否使用 ccache
          if [[ "${{ env.USE_CCACHE }}" != "false" ]]; then
              # LTO 未启用，使用 ccache。将 ccache 路径加入 PATH
              export PATH="/usr/lib/ccache:$PATH" # <--- 修改: 条件性加入 PATH
              CC_COMMAND="ccache clang"
              
              # 设置 ccache 环境变量（仅在启用 ccache 时需要）
              export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
              export CCACHE_COMPILERCHECK="none"
              export CCACHE_BASEDIR="${{ github.workspace }}"
              export CCACHE_NOHASHDIR="true"
              export CCACHE_HARDLINK="true"
              export CCACHE_DIR="${{ env.CCACHE_DIR }}"
              export CCACHE_MAXSIZE="3G"
              echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
              echo "LTO 未启用，使用 ccache clang 进行构建。"
          else
              # LTO 启用，**不**将 ccache 加入 PATH，使用纯 clang
              CC_COMMAND="clang"
              echo "LTO 启用，使用纯 clang 进行构建。"
              # 清除所有 ccache 相关的环境变量，确保干净
              unset CCACHE_LOGFILE
              unset CCACHE_COMPILERCHECK
              unset CCACHE_BASEDIR
              unset CCACHE_NOHASHDIR
              unset CCACHE_HARDLINK
              unset CCACHE_DIR
              unset CCACHE_MAXSIZE
          fi

          # LLVM 工具链的路径无论如何都要设置
          export PATH="$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang20/bin"
          
          echo "编译器信息:"
          "$CLANG_DIR/clang" --version | head -n 1
          "$CLANG_DIR/ld.lld" --version | head -n 1
          pahole --version 2>/dev/null | head -n1 || echo "pahole版本：未安装"
          
          cd kernel_workspace/common
          
          # 标准构建命令，使用 $CC_COMMAND 变量
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC_COMMAND" LD="ld.lld" HOSTLD=ld.lld O=out gki_defconfig &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC_COMMAND" LD="ld.lld" HOSTLD=ld.lld O=out Image
          
          echo "内核编译完成！"
          if [[ "${{ env.USE_CCACHE }}" != "false" ]]; then
            echo "ccache状态："
            ccache -s
          fi
          echo "编译后空间:"
          df -h
         
      - name: 克隆 AnyKernel3 并打包
        id: package
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          KSU_TYPENAME="KSU"
          
          ZIP_NAME_SUFFIX="${{ env.KERNEL_NAME }}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            ZIP_NAME_SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          fi
          
          # 定义 ZIP 文件名
          ZIP_FILE_NAME="AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_A15_${ZIP_NAME_SUFFIX}.zip"
          # 使用确定的后缀名进行打包
          zip -r ../${ZIP_FILE_NAME} ./*
          
          # 传递 ZIP 文件名给后续步骤
          echo "zip_file_name=${ZIP_FILE_NAME}" >> $GITHUB_OUTPUT

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/${{ steps.package.outputs.zip_file_name }}